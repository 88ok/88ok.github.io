<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3a6b"/>
      <stop offset="0.55" stop-color="#8f5f83"/>
      <stop offset="1" stop-color="#e8956a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#dusk)"/>
  <circle cx="880" cy="380" r="60" fill="#ffd9a0" opacity="0.95"/>
  <circle cx="880" cy="380" r="100" fill="#ffcf8a" opacity="0.25"/>
