    <rect x="30" y="270" width="14" height="18"/><rect x="105" y="300" width="14" height="18"/>
    <rect x="150" y="300" width="14" height="18"/><rect x="200" y="340" width="14" height="18"/>
    <rect x="150" y="390" width="14" height="18"/><rect x="255" y="380" width="14" height="18"/>
    <rect x="1030" y="260" width="14" height="18"/><rect x="1075" y="260" width="14" height="18"/>
    <rect x="1030" y="320" width="14" height="18"/><rect x="1105" y="350" width="14" height="18"/>
    <rect x="1145" y="400" width="14" height="18"/><rect x="920" y="390" width="14" height="18"/>
  </g>
  <!-- 街道 -->
  <rect x="0" y="620" width="1200" height="180" fill="#26233f"/>
  <path d="M520 620 L680 620 L900 800 L300 800 Z" fill="#39355a"/>
  <g stroke="#e8d9b0" stroke-width="6" opacity="0.55" stroke-dasharray="40 34">
