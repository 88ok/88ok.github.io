  <g fill="#1f1d36">
    <ellipse cx="470" cy="560" rx="17" ry="15"/>
    <rect x="455" y="575" width="30" height="45" rx="12"/>
    <rect x="460" y="618" width="9" height="42" rx="4"/>
    <rect x="473" y="618" width="9" height="42" rx="4"/>
