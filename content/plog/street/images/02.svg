<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <linearGradient id="night2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#253456"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="1" stop-color="#ffe9b0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#night2)"/>
  <!-- 星 -->
  <g fill="#ffffff">
    <circle cx="90" cy="90" r="2.2" opacity="0.8"/><circle cx="220" cy="150" r="1.5" opacity="0.6"/>
    <circle cx="700" cy="80" r="2" opacity="0.75"/><circle cx="820" cy="180" r="1.6" opacity="0.6"/>
    <circle cx="480" cy="120" r="1.8" opacity="0.7"/><circle cx="620" cy="210" r="1.4" opacity="0.55"/>
    <circle cx="140" cy="280" r="1.6" opacity="0.6"/><circle cx="790" cy="330" r="1.8" opacity="0.65"/>
  </g>
  <!-- 对街亮着灯的楼 -->
  <g fill="#141d3a">
    <rect x="0" y="330" width="150" height="420"/>
    <rect x="750" y="300" width="150" height="450"/>
  </g>
  <g fill="#ffd98a" opacity="0.85">
    <rect x="26" y="370" width="16" height="20"/><rect x="66" y="370" width="16" height="20"/>
    <rect x="106" y="370" width="16" height="20"/><rect x="26" y="430" width="16" height="20"/>
    <rect x="106" y="490" width="16" height="20"/><rect x="66" y="550" width="16" height="20"/>
    <rect x="776" y="340" width="16" height="20"/><rect x="816" y="340" width="16" height="20"/>
    <rect x="776" y="410" width="16" height="20"/><rect x="856" y="470" width="16" height="20"/>
    <rect x="816" y="530" width="16" height="20"/><rect x="776" y="600" width="16" height="20"/>
  </g>
  <!-- 便利店主体 -->
  <rect x="180" y="430" width="540" height="330" rx="6" fill="#2b3557"/>
  <!-- 招牌 -->
  <rect x="180" y="400" width="540" height="52" rx="6" fill="#1f6f5f"/>
  <rect x="210" y="416" width="150" height="20" rx="4" fill="#bfe8dc"/>
  <rect x="380" y="416" width="90" height="20" rx="4" fill="#8fd0bf"/>
  <!-- 玻璃门面（通体暖光） -->
  <rect x="205" y="470" width="490" height="240" rx="4" fill="url(#store)"/>
  <!-- 货架剪影 -->
  <g fill="#e8d9ae" opacity="0.8">
    <rect x="225" y="500" width="150" height="8" rx="3"/>
    <rect x="225" y="560" width="150" height="8" rx="3"/>
    <rect x="225" y="620" width="150" height="8" rx="3"/>
    <rect x="520" y="500" width="155" height="8" rx="3"/>
    <rect x="520" y="560" width="155" height="8" rx="3"/>
    <rect x="520" y="620" width="155" height="8" rx="3"/>
  </g>
  <g fill="#c9a86a" opacity="0.85">
    <rect x="232" y="508" width="22" height="52" rx="3"/><rect x="262" y="508" width="22" height="52" rx="3"/>
    <rect x="292" y="508" width="22" height="52" rx="3"/><rect x="322" y="508" width="22" height="52" rx="3"/>
    <rect x="232" y="568" width="22" height="52" rx="3"/><rect x="262" y="568" width="22" height="52" rx="3"/>
    <rect x="292" y="568" width="22" height="52" rx="3"/>
    <rect x="528" y="508" width="22" height="52" rx="3"/><rect x="558" y="508" width="22" height="52" rx="3"/>
    <rect x="588" y="508" width="22" height="52" rx="3"/><rect x="528" y="568" width="22" height="52" rx="3"/>
    <rect x="558" y="568" width="22" height="52" rx="3"/>
  </g>
  <!-- 门口的暖光溢出 -->
  <rect x="180" y="760" width="540" height="120" fill="url(#glow"/>
  <!-- 门口的人（坐着休息） -->
  <g fill="#16203c">
    <ellipse cx="330" cy="742" rx="26" ry="23"/>
    <rect x="300" y="762" width="60" height="86" rx="22"/>
    <rect x="298" y="838" width="96" height="20" rx="9"/>
    <rect x="316" y="856" width="18" height="52" rx="8"/>
    <rect x="366" y="856" width="18" height="52" rx="8"/>
  </g>
  <!-- 电动车 -->
  <g fill="#16203c">
    <ellipse cx="620" cy="852" rx="34" ry="34"/>
    <ellipse cx="716" cy="852" rx="34" ry="34"/>
    <rect x="600" y="760" width="120" height="46" rx="18"/>
    <rect x="686" y="700" width="16" height="80" rx="7"/>
    <rect x="660" y="688" width="60" height="14" rx="6"/>
    <rect x="700" y="700" width="10" height="30" rx="4" fill="#ffd98a"/>
  </g>
  <!-- 外卖箱 -->
  <rect x="586" y="722" width="52" height="44" rx="6" fill="#2b3557"/>
  <rect x="596" y="732" width="32" height="10" rx="4" fill="#8fd0bf"/>
  <!-- 地面 -->
  <rect x="0" y="880" width="900" height="320" fill="#1a2340"/>
  <!-- 地面反光 -->
  <rect x="240" y="880" width="420" height="240" fill="#ffe9b0" opacity="0.1"/>
  <rect x="360" y="880" width="180" height="300" fill="#ffe9b0" opacity="0.08"/>
  <!-- 路缘 -->
  <rect x="0" y="880" width="900" height="10" fill="#2b3557"/>
</svg>
