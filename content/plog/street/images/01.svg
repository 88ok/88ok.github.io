<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <linearGradient id="wall-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6d9c3"/>
      <stop offset="1" stop-color="#cdbb9d"/>
    </linearGradient>
    <linearGradient id="wall-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5a48a"/>
      <stop offset="1" stop-color="#d8c9ae"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9bda4"/>
      <stop offset="1" stop-color="#a89880"/>
    </linearGradient>
  </defs>
  <!-- 天空一线 -->
  <rect x="0" y="0" width="1024" height="180" fill="#dfe8ec"/>
  <!-- 两堵墙 -->
  <rect x="0" y="60" width="470" height="500" fill="url(#wall-l)"/>
  <rect x="554" y="20" width="470" height="540" fill="url(#wall-r)"/>
  <!-- 墙缝与砖纹 -->
  <g stroke="#b3a184" stroke-width="2" opacity="0.4">
    <line x1="0" y1="140" x2="470" y2="140"/><line x1="0" y1="220" x2="470" y2="220"/>
    <line x1="0" y1="300" x2="470" y2="300"/><line x1="0" y1="380" x2="470" y2="380"/>
    <line x1="0" y1="460" x2="470" y2="460"/>
    <line x1="554" y1="110" x2="1024" y2="110"/><line x1="554" y1="200" x2="1024" y2="200"/>
    <line x1="554" y1="290" x2="1024" y2="290"/><line x1="554" y1="380" x2="1024" y2="380"/>
    <line x1="554" y1="470" x2="1024" y2="470"/>
  </g>
  <!-- 左墙窗 -->
  <g>
    <rect x="90" y="180" width="110" height="140" rx="4" fill="#8f8271"/>
    <rect x="98" y="188" width="94" height="124" fill="#c7d4d8"/>
    <line x1="145" y1="188" x2="145" y2="312" stroke="#8f8271" stroke-width="6"/>
    <line x1="98" y1="250" x2="192" y2="250" stroke="#8f8271" stroke-width="6"/>
    <rect x="280" y="240" width="90" height="120" rx="4" fill="#7d7160"/>
    <rect x="288" y="248" width="74" height="104" fill="#b8c6cb"/>
  </g>
  <!-- 右墙窗 -->
  <g>
    <rect x="700" y="140" width="120" height="150" rx="4" fill="#8a7c66"/>
    <rect x="708" y="148" width="104" height="134" fill="#cfd9dc"/>
    <line x1="760" y1="148" x2="760" y2="282" stroke="#8a7c66" stroke-width="6"/>
    <line x1="708" y1="215" x2="812" y2="215" stroke="#8a7c66" stroke-width="6"/>
    <rect x="880" y="300" width="80" height="110" rx="4" fill="#7a6e5c"/>
    <rect x="887" y="307" width="66" height="96" fill="#b6c3c8"/>
  </g>
  <!-- 巷口地面 -->
  <rect x="0" y="560" width="1024" height="208" fill="url(#ground)"/>
  <!-- 斜切的光斑 -->
  <polygon points="470,560 554,560 700,768 380,768" fill="#f2e6c8" opacity="0.75"/>
  <polygon points="500,560 530,560 610,768 480,768" fill="#faf0d8" opacity="0.55"/>
  <!-- 墙根的影子 -->
  <rect x="0" y="560" width="120" height="208" fill="#8d7f6a" opacity="0.5"/>
  <rect x="900" y="560" width="124" height="208" fill="#8d7f6a" opacity="0.5"/>
  <!-- 自行车 -->
  <g stroke="#3c3a38" stroke-width="7" fill="none">
    <circle cx="640" cy="690" r="42"/>
    <circle cx="780" cy="690" r="42"/>
    <path d="M640 690 L700 600 L780 690 M700 600 L740 600 M660 600 L745 600"/>
    <path d="M700 600 L712 560 L735 560"/>
  </g>
  <rect x="700" y="552" width="46" height="10" rx="4" fill="#3c3a38"/>
  <rect x="734" y="560" width="10" height="26" rx="3" fill="#3c3a38"/>
  <!-- 盆栽 -->
  <g>
    <path d="M300 700 L360 700 L350 760 L310 760 Z" fill="#a9683f"/>
    <ellipse cx="330" cy="672" rx="46" ry="30" fill="#5e8a52"/>
    <ellipse cx="310" cy="650" rx="26" ry="18" fill="#6f9c5e"/>
    <ellipse cx="352" cy="655" rx="22" ry="15" fill="#547f49"/>
  </g>
  <!-- 电线 -->
  <g stroke="#4a463f" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M0 40 Q512 90 1024 30"/>
    <path d="M0 75 Q512 120 1024 65"/>
  </g>
</svg>
