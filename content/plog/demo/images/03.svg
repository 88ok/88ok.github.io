<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f1dc"/>
      <stop offset="0.55" stop-color="#a9c78c"/>
      <stop offset="1" stop-color="#7ba769"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c9a6"/>
      <stop offset="1" stop-color="#c2ae86"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <!-- 光束 -->
  <g fill="#fffbe8" opacity="0.22">
    <polygon points="180,0 320,0 520,1000 300,1000"/>
    <polygon points="420,0 500,0 700,1000 540,1000"/>
    <polygon points="620,0 700,0 880,1000 740,1000"/>
  </g>
  <!-- 小径 -->
  <path d="M430 470 L570 470 L760 1000 L240 1000 Z" fill="url(#path)"/>
  <g stroke="#b3a077" stroke-width="4" opacity="0.5">
    <line x1="470" y1="560" x2="330" y2="1000"/>
    <line x1="530" y1="560" x2="670" y2="1000"/>
  </g>
  <!-- 远处树线 -->
  <g fill="#4d7a52" opacity="0.7">
    <ellipse cx="150" cy="470" rx="120" ry="60"/>
    <ellipse cx="500" cy="450" rx="180" ry="55"/>
    <ellipse cx="850" cy="470" rx="120" ry="60"/>
  </g>
  <!-- 两侧树木 -->
  <g>
    <rect x="92" y="430" width="34" height="570" fill="#6b4f35"/>
    <ellipse cx="109" cy="400" rx="150" ry="130" fill="#3f6b45"/>
    <ellipse cx="60" cy="330" rx="90" ry="80" fill="#4d7a52"/>
    <rect x="878" y="430" width="34" height="570" fill="#6b4f35"/>
    <ellipse cx="895" cy="400" rx="150" ry="130" fill="#3f6b45"/>
    <ellipse cx="950" cy="330" rx="90" ry="80" fill="#4d7a52"/>
  </g>
  <g>
    <rect x="262" y="620" width="24" height="380" fill="#7a5c3e"/>
    <ellipse cx="274" cy="590" rx="105" ry="95" fill="#48714b"/>
    <rect x="716" y="620" width="24" height="380" fill="#7a5c3e"/>
    <ellipse cx="728" cy="590" rx="105" ry="95" fill="#48714b"/>
  </g>
  <!-- 落叶 -->
  <g fill="#c9a86a" opacity="0.7">
    <ellipse cx="420" cy="760" rx="14" ry="8" transform="rotate(-18 420 760)"/>
    <ellipse cx="590" cy="830" rx="14" ry="8" transform="rotate(24 590 830)"/>
    <ellipse cx="480" cy="910" rx="14" ry="8" transform="rotate(-8 480 910)"/>
    <ellipse cx="650" cy="720" rx="12" ry="7" transform="rotate(40 650 720)"/>
  </g>
</svg>
