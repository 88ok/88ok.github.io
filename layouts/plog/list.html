{{ define "main" -}}
<div class="td-content td-plog-index">
  <header class="td-plog-head">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="td-plog-desc">{{ . }}</p>{{ end }}
  </header>
  {{- $pages := .RegularPages.ByDate.Reverse -}}
  {{- with $pages }}
  <div class="td-plog-grid">
    {{- range . }}{{ partial "plog/card.html" . }}{{ end }}
  </div>
  {{- else }}
  <p>还没有图片博客。在 <code>content/plog/&lt;名字&gt;/</code> 下新建 index.md 和图片，写下第一篇吧。</p>
  {{- end }}
</div>
{{ end }}
