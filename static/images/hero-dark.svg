<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" role="img" aria-label="追风笔记视觉：知识与数据的流动">
  <defs>
    <radialGradient id="glowD" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="copperD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b07a"/>
      <stop offset="100%" stop-color="#c98a52"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#glowD)"/>

  <!-- 风：流动曲线 -->
  <g stroke="url(#blueD)" stroke-width="2.4" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M40 150 C 140 90, 250 200, 360 120 S 470 180, 440 250"/>
    <path d="M30 300 C 150 250, 240 360, 380 280 S 460 330, 430 380"/>
  </g>
  <g stroke="url(#copperD)" stroke-width="2" stroke-linecap="round" opacity="0.5" fill="none">
    <path d="M60 220 C 160 180, 300 260, 420 210"/>
  </g>

  <!-- 连接线：汇聚到中心 -->
  <g stroke="#5b7fb8" stroke-width="1.6" opacity="0.75">
    <line x1="240" y1="225" x2="120" y2="140"/>
    <line x1="240" y1="225" x2="372" y2="150"/>
    <line x1="240" y1="225" x2="150" y2="345"/>
    <line x1="240" y1="225" x2="352" y2="350"/>
  </g>

  <!-- 外围节点 -->
  <g>
    <circle cx="120" cy="140" r="14" fill="#16161b" stroke="url(#blueD)" stroke-width="3"/>
    <circle cx="372" cy="150" r="11" fill="#16161b" stroke="url(#copperD)" stroke-width="3"/>
    <circle cx="150" cy="345" r="12" fill="#16161b" stroke="url(#blueD)" stroke-width="3"/>
    <circle cx="352" cy="350" r="10" fill="#16161b" stroke="url(#copperD)" stroke-width="3"/>
  </g>

  <!-- 中心枢纽 -->
  <circle cx="240" cy="225" r="52" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.25"/>
  <circle cx="240" cy="225" r="34" fill="url(#blueD)"/>
  <circle cx="240" cy="225" r="34" fill="none" stroke="#0b1220" stroke-width="2" opacity="0.5"/>

  <!-- 火花点缀 -->
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="430" cy="120" r="4"/>
    <circle cx="90" cy="300" r="3.5"/>
    <circle cx="300" cy="90" r="3"/>
  </g>
</svg>
