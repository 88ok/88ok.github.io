<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" role="img" aria-label="追风笔记：一条风线穿过架构、银行业务、数据三个节点">
  <defs>
    <radialGradient id="hzGlowL" gradientUnits="userSpaceOnUse" cx="228" cy="228" r="300">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hzMainL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="0.34" stop-color="#8b5cf6"/>
      <stop offset="0.72" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hzFadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="hzFadeMaskL">
      <rect width="480" height="480" fill="url(#hzFadeL)"/>
    </mask>
  </defs>


  <!-- 风线：主线 + 两条极淡副线，右端渐隐 -->
  <g mask="url(#hzFadeMaskL)">
    <path d="M28 302C110 296 146 240 226 228C306 216 380 196 452 168"
          stroke="url(#hzMainL)" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 214C160 204 236 186 312 170"
          stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" opacity="0.52"/>
    <path d="M116 366C196 360 264 336 330 318"
          stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 三个节点：架构 / 银行业务 / 数据 -->
  <circle cx="138" cy="261" r="19" fill="#ffffff" stroke="#a78bfa" stroke-width="2.4"/>
  <circle cx="138" cy="261" r="6" fill="#c4b5fd"/>

  <circle cx="273" cy="220" r="19" fill="#ffffff" stroke="#a78bfa" stroke-width="2.4"/>
  <circle cx="273" cy="220" r="6" fill="#c4b5fd"/>

  <circle cx="391" cy="190" r="29" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.26"/>
  <circle cx="391" cy="190" r="22" fill="none" stroke="#8b5cf6" stroke-width="2.4" opacity="0.9"/>
  <circle cx="391" cy="190" r="9" fill="#6d28d9"/>

  <!-- 点缀：铜色细线与刻度，保留纸感的暖色基因 -->
  <g stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity="0.42">
    <path d="M42 322v15"/>
    <path d="M54 322v8"/>
    <path d="M66 322v15"/>
  </g>
  <circle cx="200" cy="234" r="3.2" fill="#7c3aed" opacity="0.5"/>
</svg>
