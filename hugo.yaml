title: 追风笔记
baseURL: https://88ok.github.io/
defaultContentLanguage: zh
enableMissingTranslation: false

# 标签与分类：文章 front matter 用 tags / categories 标注，
# 详情页自动展示，并生成 /tags/ 与 /categories/ 归档页。
taxonomies:
  tag: tags
  category: categories

# 语言：中文为默认（无前缀 /），英文挂在 /en/ 下，可在导航栏切换
languages:
  zh:
    label: 简体中文
    weight: 1
    title: 追风笔记
    params:
      description: 王鹏的个人技术站点：架构、银行业务、数据专栏与博客。
    menus:
      main:
        - { name: 首页, pageRef: /, weight: 10 }
        - { name: 博客, pageRef: /blog, weight: 20 }
        - identifier: columns
          name: 专栏
          pageRef: /columns
          weight: 30
        - { name: 架构专栏, pageRef: /architecture, parent: columns, weight: 31 }
        - { name: 银行业务专栏, pageRef: /banking, parent: columns, weight: 32 }
        - { name: 数据专栏, pageRef: /data, parent: columns, weight: 33 }
        - { name: 关于, pageRef: /about, weight: 40 }
  en:
    label: English
    weight: 2
    title: Zhuifeng Notes
    params:
      description: Wang Peng's personal site — architecture, banking, and data columns, plus a blog.
    menus:
      main:
        - { name: Home, pageRef: /, weight: 10 }
        - { name: Blog, pageRef: /blog, weight: 20 }
        - identifier: columns
          name: Columns
          pageRef: /columns
          weight: 30
        - { name: Architecture, pageRef: /architecture, parent: columns, weight: 31 }
        - { name: Banking, pageRef: /banking, parent: columns, weight: 32 }
        - { name: Data, pageRef: /data, parent: columns, weight: 33 }
        - { name: About, pageRef: /about, weight: 40 }

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  offlineSearch: true
  # 留空以移除主题默认的 "Powered by Oink" 页脚（站点只保留用户相关内容）。
  footer_center_info: ""
  copyright:
    authors: 王鹏
    from_year: 2026
  ui:
    showLightDarkModeMenu: true
    sidebar_menu_foldable: true

# ── 内容扩展约定（新增即自动套用当前样式，无需改代码）──────────────
# · 新增文章：在任意专栏/博客目录下加 .md 文件即可，标签/分类见 front matter。
# · 新增专栏：建 content/<新专栏>/_index.md，并写：
#       type: book
#       cascade:
#         type: book
#   即可获得「左文章树 / 中内容 / 右本页目录」三栏布局，与现有专栏一致。
# · 标签 / 分类：文章 front matter 用 tags: [...] / categories: [...] 标注，
#   详情页自动展示，并生成 /tags/ 与 /categories/ 归档页。

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
