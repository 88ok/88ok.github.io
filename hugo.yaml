title: 追风笔记
baseURL: https://88ok.github.io/
# 多域名部署策略（详见 scripts/build.sh 与仓库根 OINK升级指南.md）：
# 1) Hugo 仍用 baseURL 生成绝对地址；alias 重定向桩、canonical/hreflang 由站点级覆盖
#    （layouts/alias.html、layouts/_partials/seo-alternates.html）改为根相对；
# 2) 构建后由 scripts/build.sh 把产物中残留的 88ok.github.io 域名统一剥离为根相对路径，
#    使同一份 public/ 可原样部署到 github.io / *.pages.dev / 任意自定义域名，互不跳链。
# 切勿改用 relativeURLs: true —— 它无法改写主题用 .Permalink 生成的标签/栏目链接，
# 且会把导航变成脆弱的页相对路径；统一用「剥离域名」方案更可靠、对主题升级零耦合。
defaultContentLanguage: zh
# 中文在根路径 /，英文挂在 /en/ 下（默认语言不入子目录）。
# 换域名部署时，用 `hugo --baseURL https://你的域名/` 覆盖即可，
# 内部链接统一使用相对路径（pageRef / relref / 根相对路径），与域名解耦。
defaultContentLanguageInSubdir: false
enableMissingTranslation: false

# 标签与分类：文章 front matter 用 tags / categories 标注，
# 详情页自动展示，并生成 /tags/ 与 /categories/ 归档页。
taxonomies:
  tag: tags
  category: categories

# 语言：中文为默认（无前缀 /），英文挂在 /en/ 下，可在导航栏切换
languages:
  zh:
    contentDir: content
    label: 简体中文
    weight: 1
    title: 追风笔记
    params:
      description: 王鹏的个人技术站点：技术框架、专题专栏（架构/银行业务/数据）与博客。
      # 中文日期格式：最后修改与博客列表统一显示为「2026年8月15日」
      time_format_default: "2006年1月2日"
      time_format_blog: "2006年1月2日"
    menus:
      main:
        - { name: 博客, pageRef: /blog, weight: 10 }
        - identifier: tech
          name: 技术
          pageRef: /tech
          weight: 20
          children:
            - { name: Dubbo, pageRef: /tech/dubbo, weight: 1 }
            - { name: MySQL, pageRef: /tech/mysql, weight: 2 }
            - { name: ZooKeeper, pageRef: /tech/zookeeper, weight: 3 }
            - { name: Redis, pageRef: /tech/redis, weight: 4 }
            - { name: Kafka, pageRef: /tech/kafka, weight: 5 }
        - identifier: columns
          name: 专题
          pageRef: /columns
          weight: 30
          children:
            - { name: 架构专栏, pageRef: /architecture, weight: 1 }
            - { name: 银行业务专栏, pageRef: /banking, weight: 2 }
            - { name: 数据专栏, pageRef: /data, weight: 3 }
            - { name: 专题列表, pageRef: /columns, weight: 4 }
        - { name: 项目, pageRef: /projects, weight: 35 }
        - { name: 关于, pageRef: /about, weight: 40 }
  en:
    contentDir: content_en
    label: English
    weight: 2
    title: Zhuifeng Notes
    params:
      description: Wang Peng's personal site — tech frameworks, topic columns (architecture/banking/data), and a blog.
      ui:
        page_context_menu:
          links:
            - name: Copy link
              icon: fa-solid fa-link
              action: copy_link
            - name: Share on Weibo
              icon: fa-brands fa-weibo
              url: "https://service.weibo.com/share/share.php?url={current_url}&title={title}"
              target: _blank
            - name: Share on WeChat
              icon: fa-brands fa-weixin
              url: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={current_url}"
              target: _blank
            - name: Page QR Code
              icon: fa-solid fa-qrcode
              url: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={current_url}"
              target: _blank
            - name: Print this page
              icon: fa-solid fa-print
              action: print
    menus:
      main:
        - { name: Blog, pageRef: /blog, weight: 10 }
        - identifier: tech
          name: Tech
          pageRef: /tech
          weight: 20
          children:
            - { name: Dubbo, pageRef: /tech/dubbo, weight: 1 }
            - { name: MySQL, pageRef: /tech/mysql, weight: 2 }
            - { name: ZooKeeper, pageRef: /tech/zookeeper, weight: 3 }
            - { name: Redis, pageRef: /tech/redis, weight: 4 }
            - { name: Kafka, pageRef: /tech/kafka, weight: 5 }
        - identifier: columns
          name: Topics
          pageRef: /columns
          weight: 30
          children:
            - { name: Architecture, pageRef: /architecture, weight: 1 }
            - { name: Banking, pageRef: /banking, weight: 2 }
            - { name: Data, pageRef: /data, weight: 3 }
            - { name: All Topics, pageRef: /columns, weight: 4 }
        - { name: Projects, pageRef: /projects, weight: 35 }
        - { name: About, pageRef: /about, weight: 40 }

markup:
  goldmark:
    parser:
      # 属性行总开关：开启后 `{caption="…"}` / `{width="100"}` 等才会被解析，
      # 否则只是正文里的一行字符串（Oink 主题图片文档的两项前置配置之一）。
      attribute:
        block: true
      # 独立成段的图片后跟属性行需关闭 Goldmark 默认的段落包裹，
      # 否则图片被 <p> 包住、属性行退化为正文文本（前置配置之二）。
      # 两者配合，图片才能渲染为 figure + figcaption 并支持点击放大。
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true

params:
  offline_search: true
  # 只索引标题/描述/摘要，减小搜索包体积（内容页仍可通过摘要命中）
  offline_search_index: summary
  offline_search_max_results: 10
  # 留空以移除主题默认的 "Powered by Oink" 页脚中心文案
  footer_center_info: ""
  copyright:
    authors: 王鹏
    from_year: 2026
  ui:
    # v1.2.0 起主题提供四套视觉风格：paper（默认）/ slate / ink / terminal。
    # 显式声明，避免将来主题改默认值时站点外观意外变化。
    preset: paper
    # 是否开放「视觉风格」切换：true 仅开放稳定的 paper + slate 两套；
    # 显式列表可一次性放出全部四套（ink / terminal 为实验性风格）：
    preset_menu: [paper, slate, ink, terminal]
    dark_mode:
      enable: true
      show_menu: true
    sidebar_menu_foldable: true
    # 页面操作菜单：增加分享到微博、微信（二维码）、本页二维码、打印
    page_context_menu:
      enable: true
      assistant_links: false
      links:
        - name: 复制链接
          icon: fa-solid fa-link
          action: copy_link
        - name: 分享到微博
          icon: fa-brands fa-weibo
          url: "https://service.weibo.com/share/share.php?url={current_url}&title={title}"
          target: _blank
        - name: 分享到微信
          icon: fa-brands fa-weixin
          url: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={current_url}"
          target: _blank
        - name: 本页二维码
          icon: fa-solid fa-qrcode
          url: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={current_url}"
          target: _blank
        - name: 打印本页
          icon: fa-solid fa-print
          action: print
    # Expo 图片相册（/plog）站点级默认：布局 wall（墙壁）/ cards（卡片）/
    # seamless（无缝），尺寸 160–360 CSS 像素，图片目录模式 images/*。
    # 相册 front matter 的 expo 块整块覆盖这些值。
    expo:
      images: images/*
      mode: wall
      size: 240

# ── 内容扩展约定（新增即自动套用当前样式，无需改代码）──────────────
# · 新增文章：在任意专栏/博客目录下加 .md 文件即可，标签/分类见 front matter。
# · 图片博客（/plog，不进菜单，Oink v1.3.0 原生 Expo 相册）：一个文件夹
#   就是一个相册——content/plog/<名字>/ 下放 index.md 与 images/ 照片目录
#   （可用 `hugo new content plog/<名字>/index.md` 生成骨架）。front matter
#   写 title / description；照片在 resources 列表里声明（src 必填，写在
#   images/ 下的文件名），每张可带 params.caption 图注、params.title 标题、
#   params.weight 排序（小的在前）：
#       resources:
#         - src: images/01.jpg
#           params:
#             caption: 图片说明
#   /plog 列出所有相册（卡片封面 = 权重最小的第一张照片，自动选取）；
#   相册页是照片墙，工具栏可切换 墙壁/卡片/无缝 三种布局与尺寸，点击看
#   原图（查看器支持缩放/拖动/键盘导航）。Expo 无「拍摄地点」字段，
#   想带地点写进 description。站点级默认（布局/尺寸/图片目录模式）在
#   params.ui.expo，相册 front matter 的 expo 块可整块覆盖。
# · 新增专栏：建 content/<新专栏>/_index.md，并写：
#       type: book
#       cascade:
#         type: book
#   即可获得「左文章树 / 中内容 / 右本页目录」三栏布局，与现有专栏一致。
# · 标签 / 分类：文章 front matter 用 tags: [...] / categories: [...] 标注，
#   详情页自动展示，并生成 /tags/ 与 /categories/ 归档页。
# · 双语结构：中文源文件放 content/（默认语言，根路径 /），
#   对应的英文翻译放 content_en/ 下「相同相对路径 + 同名」文件
#   （如 content/architecture/ddd.md ↔ content_en/architecture/ddd.md），
#   Hugo 据此自动配对语言切换。新增英文请用 AI 翻译中文后落到 content_en/ 同名路径。
#   内部链接请使用相对路径（pageRef / {{< relref >}} / 根相对如 /en/blog），
#   避免写死域名，以便部署到任意域名。

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    # Oink v1.3.0 起最低要求 0.166.0；注意 Hugo 0.168 构建会带一条上游
    # LibSass 弃用警告，--panicOnWarning 严格校验请用 0.166.0。
    min: 0.166.0
